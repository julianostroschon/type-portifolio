<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Conheça o trabalho de Juliano Stroschon e explore Pulso, PJ e Fortuna: projetos de indicadores, gestão e finanças."
    />
    <meta name="theme-color" content="#f8f9f4" />
    <script>
      // Apply the preference before the first paint, including when storage is unavailable.
      let savedTheme
      try {
        savedTheme = localStorage.getItem('portfolio-theme')
      } catch {}
      const theme =
        savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
      document.documentElement.dataset.theme = theme
      document.querySelector('meta[name="theme-color"]').content =
        theme === 'dark' ? '#171c16' : '#f8f9f4'
    </script>
    <title>Juliano Stroschon — Projetos e desenvolvimento</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
